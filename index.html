
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tag HTML</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="layout">
        <header class="header">
            <strong>&lt;<span>header</span>&gt;</strong>
        </header>
        <nav class="nav">
            <strong>&lt;nav&gt;</strong>
        </nav>
        <main class="main">
            <div class="content">
                <section class="section">
                    <strong>&lt;section&gt;</strong>
                </section>
                <article class="article">
                    <strong>&lt;article&gt;</strong>
                </article>
            </div>
            <aside class="aside">
                <strong>&lt;aside&gt;</strong>
            </aside>
        </main>
        <footer class="footer">
            <strong>&lt;footer&gt;</strong>
        </footer>
    </div>
</body>
</html>
