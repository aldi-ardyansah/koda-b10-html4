<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Semantic Tag HTML</title>
    </head>
    <body>
        <table width="100%" border="1">
            <tr height="100px">
                <td align="center" colspan="2"><strong>&lt;<font color="green">header</font>&gt;</strong></td>
            </tr>
            <tr height="100px">
                <td align="center" colspan="2"><font color="blue"><strong>&lt;nav&gt;</font></strong></td>
            </tr>
            <tr height="200px">
                <td align="center"><font color="purple"><strong>&lt;section&gt;</font></strong></td>
                <td align="center" rowspan="2"><font color="yellow"><strong>&lt;aside&gt;</font></strong></td>
            </tr>
            <tr height="200px">
                <td align="center"><font color="aqua"><strong>&lt;article&gt;</font></strong></td>
            </tr>
            <tr height="100px">
                <td align="center" colspan="2"><font color="red"><strong>&lt;footer&gt;</font></strong></td>
            </tr>
        </table>
    </body>
</html>
